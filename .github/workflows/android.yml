name: Build STKSX2 Android APK (ARMSX2 core)

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: stksx2-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    name: Build universal ARM64 APK
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      ANDROID_NDK_VERSION: '29.0.14206865'
      ANDROID_CMAKE_VERSION: '3.31.6'
      ANDROID_COMPILE_SDK: '36'
      ANDROID_BUILD_TOOLS: '36.0.0'
    steps:
      - name: Checkout STKSX2 wrapper
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Preserve the Android SDK setup requested for this project.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: |
            platform-tools

      - name: Create Android debug keystore
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android"
          if [ ! -s "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
          fi
          test -s "$HOME/.android/debug.keystore"
          keytool -list -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null 2>&1 || true

      - name: Install Android SDK, NDK and CMake
        shell: bash
        run: |
          set -euo pipefail
          # Use the published stable Android API 36 platform. The upstream
          # Gradle files are patched below to use AndroidX versions compatible with API 36.
          sdkmanager --install "platforms;android-${ANDROID_COMPILE_SDK}"
          sdkmanager --install \
            "build-tools;${ANDROID_BUILD_TOOLS}" \
            "ndk;${ANDROID_NDK_VERSION}" \
            "cmake;${ANDROID_CMAKE_VERSION}"
          sdkmanager --list_installed | grep -F "ndk;${ANDROID_NDK_VERSION}"
          sdkmanager --list_installed | grep -F "cmake;${ANDROID_CMAKE_VERSION}"
          sdkmanager --list_installed | grep -F "platforms;android-${ANDROID_COMPILE_SDK}"
          sdkmanager --list_installed | grep -F "build-tools;${ANDROID_BUILD_TOOLS}"

      - name: Fetch ARMSX2 and its submodules
        shell: bash
        run: |
          set -euo pipefail
          git clone --recurse-submodules https://github.com/ARMSX2/ARMSX2.git upstream/ARMSX2
          git -C upstream/ARMSX2 rev-parse HEAD | tee upstream-armsx2-commit.txt
          git -C upstream/ARMSX2 submodule status --recursive
          # The current upstream Android branch requests API 37, which is not
          # available from this runner's SDK repository. Apply the compatibility
          # patch in the next step rather than failing during SDK installation.

      - name: Patch Android SDK and AndroidX versions for stable API 36
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYCODE'
          from pathlib import Path
          app = Path("upstream/ARMSX2/platforms/android/app/build.gradle.kts")
          catalog = Path("upstream/ARMSX2/platforms/android/gradle/libs.versions.toml")
          if not app.is_file() or not catalog.is_file():
              raise SystemExit("Could not find expected ARMSX2 Gradle files; upstream layout changed.")
          app_text = app.read_text()
          if "compileSdk = 37" not in app_text or "targetSdk = 37" not in app_text:
              raise SystemExit("Expected compileSdk/targetSdk 37 declarations were not found; refusing an unsafe patch.")
          app_text = app_text.replace("compileSdk = 37", "compileSdk = 36", 1)
          app_text = app_text.replace("targetSdk = 37", "targetSdk = 36", 1)
          app.write_text(app_text)
          catalog_text = catalog.read_text()
          replacements = {
              'coreKtx = "1.19.0"': 'coreKtx = "1.18.0"',
              'lifecycle = "2.11.0"': 'lifecycle = "2.10.0"',
          }
          for old, new in replacements.items():
              if old not in catalog_text:
                  raise SystemExit(f"Expected dependency version not found: {old}")
              catalog_text = catalog_text.replace(old, new, 1)
          catalog.write_text(catalog_text)
          print("Patched compileSdk/targetSdk to 36, core-ktx to 1.18.0 and lifecycle to 2.10.0")
          PYCODE
          grep -E 'compileSdk =|targetSdk =' upstream/ARMSX2/platforms/android/app/build.gradle.kts
          grep -E 'coreKtx =|lifecycle =' upstream/ARMSX2/platforms/android/gradle/libs.versions.toml

      - name: Fetch existing Play! launcher icon assets
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/jpd002/Play-.git upstream/Play-icon-source
          git -C upstream/Play-icon-source rev-parse HEAD | tee upstream-play-icon-commit.txt

      - name: Apply STKSX2 branding and preserve the existing icon
        run: python3 scripts/brand_armsx2.py upstream/ARMSX2 upstream/Play-icon-source

      - name: Customize STKSX2 UI and remove upstream-only features
        shell: bash
        run: python3 scripts/customize_stksx2.py upstream/ARMSX2

      - name: Rebrand first-run setup screen as STKSX2
        shell: bash
        run: python3 scripts/customize_stksx2_onboarding.py upstream/ARMSX2
        
      - name: Fetch shaderc dependencies
        working-directory: upstream/ARMSX2/platforms/android
        shell: bash
        run: |
          set -euo pipefail
          python3 app/src/main/cpp/3rdparty/shaderc/utils/git-sync-deps

      - name: Install Rust Android target for librashader
        shell: bash
        run: rustup target add aarch64-linux-android

      - name: Build and verify universal page-size APK
        working-directory: upstream/ARMSX2/platforms/android
        shell: bash
        run: |
          set -euo pipefail
          ./tools/build-universal-page-apk.sh \
            "$GITHUB_WORKSPACE/STKSX2-Android-universal.apk" \
            --application-id com.stk.stksx2
          test -s "$GITHUB_WORKSPACE/STKSX2-Android-universal.apk"
          sha256sum "$GITHUB_WORKSPACE/STKSX2-Android-universal.apk"

      - name: Record build provenance
        shell: bash
        run: |
          {
            echo "STKSX2 Android build"
            echo "Wrapper commit: $GITHUB_SHA"
            echo "ARMSX2 commit: $(cat upstream-armsx2-commit.txt)"
            echo "Play! icon source commit: $(cat upstream-play-icon-commit.txt)"
            echo "Built at UTC: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo "Core: ARMSX2/PCSX2-derived ARM64 Android emulator"
            echo "Application ID: com.stk.stksx2"
            echo "Icon: copied from the Play! source used by the previous STKSX2 workflow"
          } > STKSX2-build-info.txt

      - name: Upload installable universal APK
        uses: actions/upload-artifact@v4
        with:
          name: STKSX2-Android-universal-debug
          path: |
            STKSX2-Android-universal.apk
            STKSX2-build-info.txt
          if-no-files-found: error
          retention-days: 30
